name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.9
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Debug env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which gradle && gradle --version | head -3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --console=plain > build_output.txt 2>&1

      - name: Find APK
        if: success()
        run: |
          find android -name "*.apk" -type f

      - name: Report build error
        if: failure()
        run: |
          python3 -c "
          import json,urllib.request,os
          err=open('android/build_output.txt').read()[-4000:]
          body='\`\`\`\n'+err+'\n\`\`\`'
          data=json.dumps({'title':'[CI] Build Error','body':body}).encode()
          req=urllib.request.Request('https://api.github.com/repos/${{ github.repository }}/issues', data=data, headers={'Authorization':'token ${{ secrets.GITHUB_TOKEN }}','Content-Type':'application/json','Accept':'application/vnd.github+json'})
          try:
              urllib.request.urlopen(req); print('issue created')
          except Exception as e:
              print('issue create failed:', e)
          "

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-apk
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error
